<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema OGB</title>
<style>
:root{--rosa:#c2255c;--fundo:#f6f6f8;--cartao:#fff;--texto:#1b1b1f;--suave:#666b76;--borda:#e1e2e7}
@media (prefers-color-scheme: dark){:root{--rosa:#f06595;--fundo:#121215;--cartao:#1c1c21;--texto:#ececf1;--suave:#a3a6b1;--borda:#30313a}}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:24px;margin:0 0 4px}
p{color:var(--suave);margin:0 0 24px}
a.app{display:block;background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:16px;color:inherit;text-decoration:none}
a.app b{color:var(--rosa);font-size:18px}
</style>
</head>
<body>
<main>
  <h1>Sistema OGB</h1>
  <p>Colégio e Curso OGB</p>
  <a class="app" href="leitor-gabarito/"><b>Leitor de Gabaritos</b><br>Corrige os cartões-resposta dos simulados pela câmera do celular e gera a planilha de notas.</a>
</main>
</body>
</html>
